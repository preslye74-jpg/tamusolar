<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Lato:wght@300;400&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap');

  :root {
    --maroon: #500000;
    --cream: #FCF3EC;
    --dusty-rose: #CCB1B2;
    --black: #000000;
    --white: #FFFFFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    background: var(--maroon);
    position: relative;
  }

  .accent-bar {
    position: absolute;
    left: 0; top: 0;
    width: 9px; height: 100%;
    background: rgba(252, 243, 236, 0.25);
    z-index: 10;
  }

  /* Editorial tag */
  .editorial-tag {
    position: absolute;
    top: 72px;
    left: 52px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dusty-rose);
  }

  /* Opening quote mark */
  .quote-mark {
    position: absolute;
    top: 100px;
    right: 52px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 220px;
    line-height: 1;
    color: rgba(252, 243, 236, 0.07);
    user-select: none;
  }

  /* The quote text */
  .quote-text {
    position: absolute;
    top: 152px;
    left: 52px;
    right: 80px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 72px;
    line-height: 1.15;
    color: var(--white);
    letter-spacing: 0.01em;
  }

  /* Diagonal accent line */
  .diagonal-rule {
    position: absolute;
    top: 880px;
    left: 52px;
    width: 680px;
    height: 2px;
    background: var(--dusty-rose);
    transform: rotate(-1.5deg);
    opacity: 0.5;
  }

  /* Attribution block */
  .attribution {
    position: absolute;
    top: 910px;
    left: 52px;
  }

  .attribution .attr-name {
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cream);
  }

  .attribution .attr-role {
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dusty-rose);
    margin-top: 6px;
  }

  /* Photo strip — full width, bottom 280px */
  .photo-strip {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 310px;
    background: #1a0000;
    overflow: hidden;
  }

  .photo-strip .photo-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(204, 177, 178, 0.4);
  }

  /* Gradient from maroon into photo strip */
  .photo-strip::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(to bottom, var(--maroon), transparent);
    z-index: 2;
  }

  /* Left accent on photo strip */
  .photo-strip::after {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 9px; height: 100%;
    background: rgba(252, 243, 236, 0.25);
  }

  /* Team tag */
  .team-tag {
    position: absolute;
    top: 72px;
    right: 52px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(252, 243, 236, 0.28);
  }

  /* Sun watermark */
  .sun-watermark {
    position: absolute;
    bottom: 260px;
    right: -30px;
    width: 260px;
    height: 260px;
    opacity: 0.05;
    z-index: 1;
  }

  .sun-watermark svg { width: 100%; height: 100%; }
</style>
</head>
<body>

  <div class="accent-bar"></div>

  <div class="editorial-tag">Team Voice · 2026</div>
  <div class="team-tag">TAMU Solar</div>

  <div class="quote-mark">"</div>

  <div class="quote-text">
    "[ Drop the pull quote here. Two to four lines. First person. Direct. No fluff. ]"
  </div>

  <div class="diagonal-rule"></div>

  <div class="attribution">
    <div class="attr-name">[ First Last ]</div>
    <div class="attr-role">[ Role · Sub-team · Year ]</div>
  </div>

  <div class="photo-strip">
    <span class="photo-label">[ PHOTO — candid, action, or detail shot ]</span>
  </div>

  <div class="sun-watermark">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="42" fill="white"/>
      <line x1="100" y1="10" x2="100" y2="40" stroke="white" stroke-width="8" stroke-linecap="round"/>
      <line x1="100" y1="160" x2="100" y2="190" stroke="white" stroke-width="8" stroke-linecap="round"/>
      <line x1="10" y1="100" x2="40" y2="100" stroke="white" stroke-width="8" stroke-linecap="round"/>
      <line x1="160" y1="100" x2="190" y2="100" stroke="white" stroke-width="8" stroke-linecap="round"/>
      <line x1="29" y1="29" x2="50" y2="50" stroke="white" stroke-width="8" stroke-linecap="round"/>
      <line x1="150" y1="150" x2="171" y2="171" stroke="white" stroke-width="8" stroke-linecap="round"/>
      <line x1="171" y1="29" x2="150" y2="50" stroke="white" stroke-width="8" stroke-linecap="round"/>
      <line x1="29" y1="171" x2="50" y2="150" stroke="white" stroke-width="8" stroke-linecap="round"/>
    </svg>
  </div>

</body>
</html>
