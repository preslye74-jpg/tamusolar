<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Lato:wght@300;400&family=Cormorant+Garamond:ital@1&display=swap');

  :root {
    --maroon: #500000;
    --cream: #FCF3EC;
    --dusty-rose: #CCB1B2;
    --black: #000000;
    --white: #FFFFFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'League Spartan', sans-serif;
    background: var(--cream);
    position: relative;
  }

  .accent-bar {
    position: absolute;
    left: 0; top: 0;
    width: 9px; height: 100%;
    background: var(--maroon);
    z-index: 10;
  }

  /* Right maroon vertical panel */
  .right-panel {
    position: absolute;
    right: 0; top: 0;
    width: 460px; height: 1350px;
    background: var(--maroon);
    z-index: 2;
  }

  /* Diagonal slash between panels */
  .slash {
    position: absolute;
    top: 0;
    left: 560px;
    width: 110px;
    height: 1350px;
    background: var(--maroon);
    clip-path: polygon(60% 0, 100% 0, 40% 100%, 0% 100%);
    z-index: 3;
  }

  /* Left: logo zone */
  .logo-zone {
    position: absolute;
    left: 52px;
    top: 50%;
    transform: translateY(-50%);
    width: 520px;
    height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .logo-placeholder {
    width: 380px;
    height: 200px;
    border: 2px dashed rgba(80, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(80, 0, 0, 0.35);
  }

  /* Right panel content */
  .powered-label {
    position: absolute;
    top: 140px;
    right: 52px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(252, 243, 236, 0.5);
    z-index: 5;
    text-align: right;
  }

  .sponsor-name {
    position: absolute;
    top: 180px;
    right: 48px;
    font-family: 'League Spartan', sans-serif;
    font-weight: 900;
    font-size: 68px;
    line-height: 0.9;
    color: var(--white);
    text-transform: uppercase;
    letter-spacing: -1px;
    text-align: right;
    z-index: 5;
    max-width: 400px;
  }

  /* Dusty rose rule */
  .rule {
    position: absolute;
    top: 470px;
    right: 52px;
    width: 200px;
    height: 2px;
    background: var(--dusty-rose);
    z-index: 5;
    opacity: 0.6;
  }

  /* Contribution text */
  .contribution {
    position: absolute;
    top: 498px;
    right: 52px;
    max-width: 360px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 28px;
    line-height: 1.45;
    color: var(--cream);
    text-align: right;
    z-index: 5;
  }

  /* Partnership since */
  .since-tag {
    position: absolute;
    bottom: 200px;
    right: 52px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dusty-rose);
    z-index: 5;
  }

  /* Thank you line */
  .thank-line {
    position: absolute;
    bottom: 148px;
    right: 52px;
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--white);
    z-index: 5;
  }

  /* Bottom tag */
  .team-tag {
    position: absolute;
    bottom: 60px;
    right: 52px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(252, 243, 236, 0.3);
    z-index: 5;
  }

  /* Section label top left */
  .section-label {
    position: absolute;
    top: 72px;
    left: 52px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(80, 0, 0, 0.45);
    z-index: 1;
  }

  /* Bottom cream strip — diagonal accent */
  .bottom-slash {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 680px;
    height: 80px;
    background: rgba(80, 0, 0, 0.06);
    clip-path: polygon(0 100%, 100% 0, 100% 100%);
    z-index: 1;
  }

  /* Sun watermark cream side */
  .sun-watermark {
    position: absolute;
    top: 160px;
    left: 100px;
    width: 300px;
    height: 300px;
    opacity: 0.04;
    z-index: 1;
  }

  .sun-watermark svg { width: 100%; height: 100%; }
</style>
</head>
<body>

  <div class="accent-bar"></div>
  <div class="right-panel"></div>
  <div class="slash"></div>

  <div class="section-label">Partner Spotlight · 2026</div>

  <div class="logo-zone">
    <div class="logo-placeholder">[ SPONSOR LOGO ]</div>
  </div>

  <div class="powered-label">Powered by</div>
  <div class="sponsor-name">[ SPONSOR<br>NAME ]</div>

  <div class="rule"></div>

  <div class="contribution">
    "[ One sentence on what this sponsor provides — power electronics, composites, funding, etc. ]"
  </div>

  <div class="since-tag">Partner since [ YEAR ]</div>
  <div class="thank-line">Thank you. ☀</div>
  <div class="team-tag">Texas A&amp;M Solar Car Racing</div>

  <div class="bottom-slash"></div>

  <div class="sun-watermark">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="42" fill="black"/>
      <line x1="100" y1="10" x2="100" y2="40" stroke="black" stroke-width="8" stroke-linecap="round"/>
      <line x1="100" y1="160" x2="100" y2="190" stroke="black" stroke-width="8" stroke-linecap="round"/>
      <line x1="10" y1="100" x2="40" y2="100" stroke="black" stroke-width="8" stroke-linecap="round"/>
      <line x1="160" y1="100" x2="190" y2="100" stroke="black" stroke-width="8" stroke-linecap="round"/>
      <line x1="29" y1="29" x2="50" y2="50" stroke="black" stroke-width="8" stroke-linecap="round"/>
      <line x1="150" y1="150" x2="171" y2="171" stroke="black" stroke-width="8" stroke-linecap="round"/>
      <line x1="171" y1="29" x2="150" y2="50" stroke="black" stroke-width="8" stroke-linecap="round"/>
      <line x1="29" y1="171" x2="50" y2="150" stroke="black" stroke-width="8" stroke-linecap="round"/>
    </svg>
  </div>

</body>
</html>
