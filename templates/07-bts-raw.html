<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Lato:wght@300;400&display=swap');

  :root {
    --maroon: #500000;
    --cream: #FCF3EC;
    --dusty-rose: #CCB1B2;
    --black: #000000;
    --white: #FFFFFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'League Spartan', sans-serif;
    background: #111;
    position: relative;
  }

  /* Full-bleed photo zone */
  .photo-zone {
    position: absolute;
    inset: 0;
    background: #1c1c1c;
    z-index: 0;
  }

  .photo-zone .photo-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    text-align: center;
    line-height: 2;
  }

  /* Bottom dark scrim */
  .scrim {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 480px;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.6) 55%, transparent 100%);
    z-index: 2;
  }

  /* Left accent bar */
  .accent-bar {
    position: absolute;
    left: 0; top: 0;
    width: 9px; height: 100%;
    background: var(--maroon);
    z-index: 10;
  }

  /* Top badge */
  .badge {
    position: absolute;
    top: 56px;
    left: 40px;
    background: var(--maroon);
    padding: 10px 20px;
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--white);
    z-index: 10;
  }

  /* Date/location top right */
  .date-tag {
    position: absolute;
    top: 62px;
    right: 46px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    z-index: 10;
    text-align: right;
  }

  /* Caption text — bottom overlay */
  .caption {
    position: absolute;
    bottom: 108px;
    left: 40px;
    right: 46px;
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 24px;
    line-height: 1.45;
    color: var(--white);
    z-index: 5;
    letter-spacing: 0.01em;
  }

  /* Team tag */
  .team-tag {
    position: absolute;
    bottom: 54px;
    left: 40px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    z-index: 5;
  }

  /* Logo top-right */
  .logo-top {
    position: absolute;
    top: 40px;
    right: 40px;
    width: 56px;
    height: 56px;
    object-fit: contain;
    opacity: 0.32;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="photo-zone">
    <span class="photo-label">[ FULL-BLEED PHOTO ]<br>candid · action · detail · raw</span>
  </div>

  <div class="scrim"></div>
  <div class="accent-bar"></div>

  <div class="badge">[ BUILD SEASON / TEST DAY / RACE WEEK ]</div>
  <div class="date-tag">[ Location ]<br>[ Date ]</div>

  <div class="caption">[ One-line caption. Short. Real. ]</div>

  <div class="team-tag">Texas A&amp;M Solar Car Racing · Eos #12</div>

  <img class="logo-top" src="file:///home/user/tamusolar/assets/logo-white.png" alt="TAMU Solar">

  <!-- CAPTION: Eos. Up close. ☀️ [Location] · #TAMUSolar #GigEm -->

</body>
</html>
