<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Lato:wght@300;400&display=swap');

  :root {
    --maroon: #500000;
    --cream: #FCF3EC;
    --dusty-rose: #CCB1B2;
    --black: #000000;
    --white: #FFFFFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'League Spartan', sans-serif;
    background: #0a0000;
    position: relative;
  }

  /* Full-bleed photo zone */
  .photo-zone {
    position: absolute;
    inset: 0;
    background: #180000;
    z-index: 0;
  }

  .photo-zone .photo-label {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.15);
    text-align: center;
    line-height: 2;
  }

  /* Gradient overlay — heavy maroon from bottom */
  .gradient-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(80, 0, 0, 0.92) 0%,
      rgba(80, 0, 0, 0.65) 35%,
      rgba(80, 0, 0, 0.15) 65%,
      transparent 100%
    );
    z-index: 2;
  }

  /* Accent bar */
  .accent-bar {
    position: absolute;
    left: 0; top: 0;
    width: 9px; height: 100%;
    background: rgba(252, 243, 236, 0.4);
    z-index: 10;
  }

  /* Main headline — bottom-left, bleeds slightly */
  .headline {
    position: absolute;
    bottom: 280px;
    left: -8px;
    font-family: 'League Spartan', sans-serif;
    font-weight: 900;
    font-size: 158px;
    line-height: 0.87;
    color: var(--white);
    text-transform: uppercase;
    letter-spacing: -4px;
    z-index: 5;
  }

  /* Sub headline */
  .sub-headline {
    position: absolute;
    bottom: 192px;
    left: 40px;
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cream);
    z-index: 5;
    opacity: 0.85;
  }

  /* Race dates stack */
  .dates-block {
    position: absolute;
    bottom: 102px;
    left: 40px;
    z-index: 5;
  }

  .dates-block .event-line {
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(252, 243, 236, 0.7);
    margin-bottom: 5px;
  }

  .dates-block .event-line strong {
    font-weight: 400;
    color: var(--cream);
  }

  /* Logo top-right */
  .logo-top {
    position: absolute;
    top: 44px;
    right: 44px;
    width: 68px;
    height: 68px;
    object-fit: contain;
    opacity: 0.55;
    z-index: 10;
  }

  /* Team name top */
  .team-name {
    position: absolute;
    top: 68px;
    left: 40px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    z-index: 10;
  }

  /* Thin maroon rule above dates */
  .date-rule {
    position: absolute;
    bottom: 90px;
    left: 40px;
    width: 440px;
    height: 1px;
    background: rgba(252, 243, 236, 0.2);
    z-index: 5;
  }
</style>
</head>
<body>

  <div class="photo-zone">
    <span class="photo-label">[ FULL-BLEED PHOTO ]<br>car · action · team · dramatic angle ]</span>
  </div>

  <div class="gradient-overlay"></div>
  <div class="accent-bar"></div>

  <div class="team-name">Texas A&amp;M Solar Car Racing · Eos #12</div>

  <img class="logo-top" src="file:///home/user/tamusolar/assets/logo-white.png" alt="TAMU Solar">

  <div class="headline">FSGP<br>2026</div>
  <div class="sub-headline">Brainerd International Raceway</div>

  <div class="date-rule"></div>

  <div class="dates-block">
    <div class="event-line"><strong>FSGP</strong> · Jul 21–23, 2026</div>
    <div class="event-line"><strong>ASC</strong> · Jul 25 – Aug 1, 2026</div>
    <div class="event-line">Brainerd, MN</div>
  </div>

  <!-- CAPTION: Eos. Car #12. Brainerd bound. ☀️ FSGP · Jul 21–23 / ASC · Jul 25–Aug 1 · #TAMUSolar #GigEm #FSGP2026 #ASC2026 -->

</body>
</html>
